<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title desc">
  <title id="title">Linux and DevOps Trainer</title>
  <desc id="desc">Cyan and indigo project card with a terminal prompt and grid</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071016"/><stop offset="1" stop-color="#161E46"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#155E75" opacity=".25"/></pattern></defs>
  <rect width="640" height="260" rx="18" fill="url(#bg)"/><rect width="640" height="260" rx="18" fill="url(#grid)"/>
  <g transform="translate(410 56)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="198" height="144" rx="9" fill="#050B10" stroke="#164E63" stroke-width="2"/>
    <circle cx="18" cy="18" r="4" fill="#22D3EE"/><circle cx="34" cy="18" r="4" fill="#6366F1"/>
    <text x="18" y="59" fill="#67E8F9" font-size="15">$ open topic</text>
    <text x="18" y="88" fill="#94A3B8" font-size="14">linux/files</text>
    <text x="18" y="118" fill="#A5B4FC" font-size="15">&gt; practice_</text>
    <rect x="111" y="103" width="8" height="19" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="34" y="42" fill="#7FA3B5" font-size="16" letter-spacing="2">THEORY · TERMINAL · LABS</text>
    <text x="34" y="92" fill="#F1F5F9" font-size="29" font-weight="700">LINUX &amp; DEVOPS</text>
    <text x="34" y="128" fill="#67E8F9" font-size="25" font-weight="600">TRAINER</text>
    <text x="36" y="158" fill="#CBD5E1" font-size="17">Practice for engineering interviews</text>
    <g font-size="15" fill="#061016">
      <rect x="34" y="184" width="82" height="30" rx="7" fill="#67E8F9"/><text x="49" y="205">PYTHON</text>
      <rect x="124" y="184" width="72" height="30" rx="7" fill="#67E8F9"/><text x="139" y="205">LINUX</text>
      <rect x="204" y="184" width="82" height="30" rx="7" fill="#67E8F9"/><text x="219" y="205">TESTING</text>
    </g>
  </g>
  <rect x="1" y="1" width="638" height="258" rx="17" fill="none" stroke="#164E63" stroke-width="2"/>
</svg>
